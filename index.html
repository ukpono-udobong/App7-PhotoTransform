<head>
  <meta charset="utf-8">
  <title>Photo Transform</title>
  <meta name="viewport" content="width=device-width, initial-scale=.7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
  <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
  <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>

  <script>
    var docMod = document.lastModified; // Get last modified timestamp
    console.log("This file last modified  " + docMod); // Log it to console

    // iOS fix for image distortion
    function detectVerticalSquash(img) {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = ih;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, 1, ih).data;
      var sy = 0, ey = ih, py = ih;
      while (py > sy) {
        var alpha = data[(py - 1) * 4 + 3];
        if (alpha === 0) ey = py; else sy = py;
        py = (ey + sy) >> 1;
      }
      return (py / ih) || 1;
    }

    function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
      var ratio = detectVerticalSquash(img);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / ratio);
    }

    // This function runs once everything is loaded
    window.onload = function () {
      var fileInput = document.getElementById('fileInput');
      var messageDisplayArea = document.getElementById('messageDisplayArea');

      fileInput.addEventListener('change', function () {
        var file = fileInput.files[0];
        var imageType = /image.*/;

        if (file.type.match(imageType)) {
          var reader = new FileReader();

          reader.onload = function () {
            messageDisplayArea.innerHTML = "You picked an image!";
            var img = new Image();

            img.onload = function () {
              drawImageIOSFix(context, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

              // ++++++++ BEGIN IMAGE PROCESSING ++++++++
              // You can add further image manipulation code here (like grayscale, brightness etc.)
              // +++++++++++++++++++++++++++++++++++++++++
            }

            img.src = reader.result;
          }

          reader.readAsDataURL(file);
        } else {
          messageDisplayArea.innerHTML = "File not supported!";
        }
      });
    }
  </script>
</head>

<body>
  <div data-role="page">
    <div data-role="header">
      <h1>Primary Colors</h1>
    </div>

    <div data-role="content">
      <h2>Push button to take picture.</h2>

      <div>
        Press orange button to create or choose image file:
        <input type="file" id="fileInput" style="background-color: #FF6600;">
      </div>

      <div id="messageDisplayArea"></div>

      <!-- This canvas is where the image will show up -->
      <canvas id="myCanvas" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas>

      <script>
        // This sets up the canvas and writes starting text on it
        var canvas = document.getElementById('myCanvas');
        var context = canvas.getContext("2d");
        context.font = '20pt Calibri';
        context.fillStyle = "black";
        context.fillText("Original image will go here", 10, 20);
      </script>
    </div>

    <div data-role="footer" data-position="fixed">
      <p>DIY Diagnostics</p>
    </div>
  </div>
</body>
