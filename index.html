  <script>
    // Show the last modified date of this file in the browser console
    var docMod = document.lastModified;
    console.log("This file last modified  " + docMod);

    // This function fixes iOS image display issues on canvas
    function detectVerticalSquash(img) {
      var iw = img.naturalWidth, ih = img.naturalHeight;
      var canvas = document.createElement('canvas');
      canvas.width = 1;
      canvas.height = ih;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, 1, ih).data;
      var sy = 0, ey = ih, py = ih;
      while (py > sy) {
        var alpha = data[(py - 1) * 4 + 3];
        if (alpha === 0) {
          ey = py;
        } else {
          sy = py;
        }
        py = (ey + sy) >> 1;
      }
      var ratio = (py / ih);
      return (ratio === 0) ? 1 : ratio;
    }

    // Helper function to correctly draw the image on canvas accounting for iOS bugs
    function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) {
      var vertSquashRatio = detectVerticalSquash(img);
      ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio);
    }

    // Runs after the page loads
    window.onload = function () {
      var fileInput = document.getElementById('fileInput');
      var messageDisplayArea = document.getElementById('messageDisplayArea');

      // Listens for file selection by user
      fileInput.addEventListener('change', function (e) {
        var file = fileInput.files[0];
        var imageType = /image.*/;

        // Check if file is a supported image format
        if (file.type.match(imageType)) {
          var reader = new FileReader();
          reader.onload = function (e) {
            messageDisplayArea.innerHTML = "You picked an image!";
            var img = new Image();
            img.onload = function () {
              // Draw the original image onto the first canvas
              drawImageIOSFix(context1, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

              // Get image data from the first canvas
              var imageData = context1.getImageData(0, 0, canvas1.width, canvas1.height);
              var data = imageData.data;

              // Loop through each pixel and remove red and green color values
              for (var i = 0; i < data.length; i += 4) {
                data[i] = 0;      // Red channel = 0
                data[i + 1] = 0;  // Green channel = 0
                // Leave the blue channel (data[i + 2]) as is
              }

              // Display the modified image on the second canvas (blue only)
              context2.putImageData(imageData, 0, 0);
            }
            img.src = reader.result; // Set the image source to trigger load
          }
          reader.readAsDataURL(file); // Start reading image as data URL
        } else {
          messageDisplayArea.innerHTML = "File not supported!"
        }
      });
    }
  </script>

<body>
  <div data-role="page">
    <div data-role="header">
      <h1>Blue Intensity Filter</h1>
    </div>

    <div data-role="content">
      <h2>Select an image to analyze</h2>
      <input type="file" id="fileInput" style="background-color: #FF6600;">
      <div id="messageDisplayArea"></div>

      <!-- First canvas to show the original image -->
      <p>Original Image:</p>
      <canvas id="myCanvas1" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas>
      <script>
        var canvas1 = document.getElementById('myCanvas1');
        var context1 = canvas1.getContext("2d");
        context1.font = '16pt Arial';
        context1.fillText("This is where the original image goes", 10, 30);
      </script>

      <!-- Second canvas to show only the blue intensities -->
      <p>Blue Intensity Only:</p>
      <canvas id="myCanvas2" width="600" height="500" style="border:1px solid #d3d3d3;"></canvas>
      <script>
        var canvas2 = document.getElementById('myCanvas2');
        var context2 = canvas2.getContext("2d");
        context2.font = '16pt Arial';
        context2.fillText("This is where the blue intensity version will go", 10, 30);
      </script>
    </div>

    <div data-role="footer" data-position="fixed">

    </div>
